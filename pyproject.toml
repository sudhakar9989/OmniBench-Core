[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibench"
version = "1.0.0"
description = "OmniBench: A High-Throughput Benchmarking & Evaluation Harness for Multimodal Vision-Language Models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

dependencies = [
    "accelerate>=0.28.0", "datasets>=2.16.0", "decord>=0.6.0",
    "einops>=0.7.0", "google-genai>=0.1.1", "huggingface_hub>=0.20.0",
    "jieba>=0.42.1", "litellm>=1.55.0", "math-verify",
    "matplotlib>=3.7.0", "numpy>=1.24.0", "openai>=1.20.0",
    "opencv-python>=4.8.0.76", "openpyxl>=3.1.0", "pandas>=2.0.0",
    "pillow>=10.0.0", "python-dotenv>=1.0.0", "rich>=13.4.0",
    "scikit-learn>=1.3.0", "tabulate>=0.9.0", "timm>=0.9.0",
    "torch>=2.1.0", "torchvision>=0.16.0", "tqdm>=4.65.0",
    "transformers>=4.45.0", "typing_extensions>=4.8.0", "xlsxwriter>=3.1.0",
]

[project.scripts]
omnibench = "omnibench.runner:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "scripts*", "docs*", "assets*"]
